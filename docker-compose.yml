# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: tp
      POSTGRES_DB: tp_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d tp_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
